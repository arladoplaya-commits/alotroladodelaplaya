name: Actualizar sitemap
on:
  push:
    branches: [main]
    paths: ["data/menu.json"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/update-sitemap.py
      - name: Guardar si cambió
        run: |
          if ! git diff --quiet sitemap.xml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add sitemap.xml
            git commit -m "chore: actualizar sitemap"
            git push
          fi
