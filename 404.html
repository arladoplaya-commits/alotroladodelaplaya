<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex"/>
<meta name="theme-color" content="#f6dfb2"/>
<title>Al Otro Lado de la Playa · Página no encontrada</title>
<link rel="icon" href="/alotroladodelaplaya/images/logo.png"/>
<style>
body{margin:0;background:#fdf3e0;color:#4a3b28;font-family:system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{max-width:32rem;margin:0 auto;padding:24px 16px 40px;min-height:100vh;box-sizing:border-box}
a.home{display:inline-block;margin-bottom:16px;font-weight:700;color:#c2542f;text-decoration:none}
.box{text-align:center;padding:40px 12px}.box h1{font-size:22px;color:#c2542f;margin:12px 0 6px}.box p{color:#6b5a40;margin:0 0 20px}
.btn{display:inline-flex;align-items:center;justify-content:center;background:#e2574c;color:#fff;font-weight:800;padding:12px 22px;border-radius:16px;text-decoration:none}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:24px;background:#f6dfb2;display:block}
.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-top:16px}
.row h2{margin:0;font-size:28px;line-height:1.15;color:#c2542f}.price{background:#fff;border-radius:999px;padding:6px 12px;color:#c2542f;font-weight:800;white-space:nowrap}
.sold{margin-top:16px;padding:10px 14px;border-radius:14px;background:#fdeae0;border:2px dashed #e8b08a;color:#b3562e;font-weight:700;text-align:center;font-size:14px}
</style></head><body><main id="m">
<a class="home" href="/alotroladodelaplaya/">🌊 Al Otro Lado de la Playa</a>
<div class="box" id="box"><div style="font-size:48px">🌊</div><h1>Esta página no existe</h1><p>Pero la carta sigue abierta.</p><a class="btn" href="/alotroladodelaplaya/">Ver la carta</a></div>
</main>
<script>
(function(){
  var base="/alotroladodelaplaya";
  var m=location.pathname.match(/\/producto\/([^\/]+?)(?:\.html)?\/?$/);
  if(!m)return;
  var slug=decodeURIComponent(m[1]);
  function slugify(s){return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"")}
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  var c=new AbortController(),t=setTimeout(function(){c.abort()},7000);
  fetch(base+"/data/menu.json?v="+Math.floor(Date.now()/60000),{cache:"no-store",signal:c.signal}).then(function(r){return r.json()}).then(function(d){
    clearTimeout(t);
    var p=null;for(var i=0;i<d.products.length;i++)if(slugify(d.products[i].name)===slug){p=d.products[i];break}
    if(!p)return;
    var cur=(d.settings&&d.settings.currency)||"$";
    var img=p.image?(/^https?:/.test(p.image)?p.image:base+p.image):"";
    var html='<a class="home" href="'+base+'/">🌊 Al Otro Lado de la Playa</a><div class="card">'+(img?'<img src="'+esc(img)+'" alt="'+esc(p.name)+'"/>':'')+
      '<div class="row"><h2>'+esc((p.emoji?p.emoji+" ":"")+p.name)+'</h2><span class="price">'+Number(p.price).toLocaleString("en-US")+" "+esc(cur)+'</span></div>'+
      '<p style="margin:12px 0 0;line-height:1.5;color:#6b5a40">'+esc(p.description||"")+'</p>'+
      (p.available===false?'<div class="sold">Agotado por ahora 🌙</div><div style="margin-top:16px"><a class="btn" style="width:100%;box-sizing:border-box" href="'+base+'/">Ver la carta</a></div>':
      '<div style="margin-top:20px"><a class="btn" style="width:100%;box-sizing:border-box" href="'+base+'/?abrir='+encodeURIComponent(p.id)+'">🛒 Pedir en la carta</a></div>')+
      '</div>';
    document.getElementById("m").innerHTML=html;
    document.title=(p.emoji?p.emoji+" ":"")+p.name+" · Al Otro Lado de la Playa";
    var r=document.querySelector('meta[name="robots"]');if(r)r.content="index,follow";
  }).catch(function(){});
})();
</script></body></html>
