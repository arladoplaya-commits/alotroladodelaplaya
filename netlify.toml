[build]
  # Cada vez que el panel «Publica» un cambio de carta, sube solo
  # public/data/menu.json al repositorio. La carta ya lo lee directo de
  # raw.githubusercontent.com al minuto (sin esperar ningún despliegue),
  # así que reconstruir todo el sitio en Netlify por ese archivo es
  # gasto de minutos/créditos de build que no hace falta.
  #
  # Esta línea le dice a Netlify: si el único archivo que cambió en el
  # commit es public/data/menu.json, sáltate el build (sigue funcionando
  # igual porque la carta ya tenía el dato al instante). Si además cambió
  # código de verdad, el build sí se dispara como siempre.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':(exclude)public/data/menu.json'"
